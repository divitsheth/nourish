<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Food Ledger</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header><p class="eyebrow">PERSONAL NUTRITION LIBRARY</p><h1>Food Ledger</h1><p>Keep evidence-backed restaurant nutrition close at hand.</p></header>
    <section class="summary" aria-label="Today's confirmed food log"><div><span>Calories</span><strong id="calories">0</strong></div><div><span>Protein</span><strong id="protein">0g</strong></div><div><span>Known sodium</span><strong id="sodium">0mg</strong></div></section>
    <section class="toolbar"><label>Search<input id="search" type="search" placeholder="Restaurant or item" /></label><button id="clear" type="button">Clear today</button></section>
    <p id="sodium-note" class="muted"></p>
    <section id="food-list" class="food-list" aria-live="polite"></section>
  </main>
  <template id="food-template"><article class="food"><div class="food-heading"><div><p class="restaurant"></p><h2 class="name"></h2></div><label class="eat"><input type="checkbox"/> Ate this today</label></div><div class="macros"></div><p class="source"></p><p class="notes muted"></p></article></template>
  <script type="module" src="app.js"></script>
</body>
</html>
